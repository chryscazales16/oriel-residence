# Checks the settings and publishes the website to GitHub Pages every time a file
# changes on the main branch.
# One-time setup: Settings → Pages → "Build and deployment" → Source: GitHub Actions.
# While the repository is private on a free GitHub account, the settings are still
# checked but nothing is published (free GitHub Pages needs a public repository).
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publishing.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the settings and build the site
        run: node build.mjs
      - id: publishing
        name: Check that publishing is switched on
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          HAS_PAGES=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_pages)
          if [ "$HAS_PAGES" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$PRIVATE" = "true" ]; then
            echo "::notice title=Website offline because this repository is private::Your settings were checked and the site built without problems, but nothing was published. To put the website online, see 'Private or public' in README.md."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Publishing is switched off::Open Settings, then Pages, and set Source to GitHub Actions. Then come back to this run and tap Re-run all jobs."
            exit 1
          fi
      - if: steps.publishing.outputs.publish == 'true'
        uses: actions/configure-pages@v6
      - if: steps.publishing.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
